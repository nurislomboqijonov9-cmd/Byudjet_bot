<!doctype html><html lang="uz"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEMIRCHI — Boshqaruv markazi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#05070a;--side:#0a0d12;--p:#0d1117;--p2:#121821;--p3:#171f2a;--ln:#1a222d;--ln2:#263140;
  --gold:#e8b964;--em:#34d399;--ro:#fb7185;--sky:#60a5fa;--vi:#a78bfa;--am:#fbbf24;
  --tx:#f1f5f9;--t2:#cbd5e1;--mut:#7c8a9e;--dim:#4a5668;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:clamp(11px,.833vw,32px)}
body{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden;
  display:grid;grid-template-columns:17.5rem 1fr;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
.i{display:inline-flex;width:1.2rem;height:1.2rem;flex:none}
.i svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ===== Sidebar ===== */
.side{background:var(--side);border-right:1px solid var(--ln);display:flex;flex-direction:column;padding:1.8rem 1.2rem 1.4rem;min-height:0}
.sb{display:flex;align-items:center;gap:.85rem;padding:0 .5rem 1.8rem;border-bottom:1px solid var(--ln)}
.logo{width:3rem;height:3rem;border-radius:.8rem;position:relative;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#f3cf8a,#b8873c);color:#1a1205;font-weight:900;font-size:1.4rem;box-shadow:0 0 2rem rgba(232,185,100,.25)}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.brand{font-size:1.25rem;font-weight:900;letter-spacing:.16em}
.sub{font-size:.68rem;color:var(--mut);letter-spacing:.2em;text-transform:uppercase;margin-top:.3rem;font-weight:600}
.navl{font-size:.68rem;color:var(--dim);letter-spacing:.18em;text-transform:uppercase;font-weight:700;padding:1.5rem .6rem .7rem}
#nav{display:flex;flex-direction:column;gap:.25rem;flex:1;min-height:0;overflow:hidden}
.nv{position:relative;display:flex;align-items:center;gap:.8rem;padding:.8rem .8rem;border-radius:.7rem;color:var(--mut);font-size:.95rem;font-weight:600;cursor:pointer;transition:background .25s,color .25s}
.nv:hover{background:var(--p2);color:var(--t2)}
.nv .nt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv .np{font-size:.72rem;color:var(--dim);font-weight:700}
.nv.on{background:linear-gradient(90deg,rgba(232,185,100,.14),rgba(232,185,100,.03));color:var(--tx)}
.nv.on .i{color:var(--gold)}
.nv.on:before{content:"";position:absolute;left:-1.2rem;top:.6rem;bottom:.6rem;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nv .trk{position:absolute;left:.8rem;right:.8rem;bottom:.3rem;height:2px;border-radius:2px;overflow:hidden;display:none;background:rgba(255,255,255,.05)}
.nv.on .trk{display:block}
#prog{display:block;height:100%;width:0;background:var(--gold)}
.sclock{padding:1.3rem .6rem 1.1rem;border-top:1px solid var(--ln)}
.sclock .t{font-size:3.1rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.sclock .t span{font-size:1.4rem;color:var(--dim);font-weight:700;letter-spacing:0;margin-left:.2rem}
.sclock .d{font-size:.9rem;color:var(--t2);margin-top:.55rem;font-weight:600}
.sclock .d2{font-size:.8rem;color:var(--mut);margin-top:.15rem}
.ctrl{display:flex;gap:.35rem;background:var(--p);border:1px solid var(--ln);border-radius:.8rem;padding:.3rem}
.ctrl button{flex:1;height:2.5rem;border:0;border-radius:.55rem;background:transparent;color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center}
.ctrl button:hover{background:var(--p3);color:var(--tx)}
.ctrl button.pp{background:rgba(232,185,100,.13);color:var(--gold)}
.ctrl .i{width:1.05rem;height:1.05rem}

/* ===== Main ===== */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:1.6rem 2rem 1.6rem;gap:1.3rem;
  background:radial-gradient(70rem 30rem at 85% -15%,rgba(96,165,250,.06),transparent 60%),radial-gradient(50rem 30rem at 10% 120%,rgba(232,185,100,.05),transparent 60%)}
.topbar{display:flex;align-items:flex-end;gap:1.5rem;flex:none}
.eyebrow{font-size:.74rem;color:var(--mut);font-weight:700;letter-spacing:.2em;text-transform:uppercase}
h1{font-size:2.3rem;font-weight:800;letter-spacing:-.03em;margin-top:.35rem;line-height:1}
.tr{margin-left:auto;display:flex;align-items:center;gap:1rem}
.upd{font-size:.82rem;color:var(--mut);display:flex;align-items:center;gap:.4rem}
.upd .i{width:.9rem;height:.9rem}
.live{display:flex;align-items:center;gap:.5rem;font-size:.74rem;font-weight:800;letter-spacing:.18em;color:var(--em);padding:.5rem .85rem;border:1px solid rgba(52,211,153,.25);background:rgba(52,211,153,.07);border-radius:2rem}
.pulse{width:.5rem;height:.5rem;border-radius:50%;background:var(--em);animation:pl 1.8s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%{box-shadow:0 0 0 .55rem rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

.stagewrap{position:relative;flex:1;min-height:0}
#stage{position:absolute;inset:0}
.scr{height:100%;display:flex;flex-direction:column;gap:1.2rem;min-height:0}
.scr>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.scr>*:nth-child(2){animation-delay:.08s}.scr>*:nth-child(3){animation-delay:.16s}
@keyframes up{from{opacity:0;transform:translateY(.8rem)}to{opacity:1;transform:none}}

.card{background:var(--p);border:1px solid var(--ln);border-radius:1.1rem;padding:1.35rem 1.5rem;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.ch{display:flex;align-items:center;gap:.6rem;margin-bottom:1.1rem;flex:none}
.ch h3{font-size:1.05rem;font-weight:700}
.ch .hint{margin-left:auto;font-size:.82rem;color:var(--mut);font-weight:500}
.ch .hint b{color:var(--tx)}
.dotc{width:.6rem;height:.6rem;border-radius:.2rem;background:var(--c)}

/* KPI */
.kpis{display:grid;gap:1.1rem;flex:none}
.kpi{background:var(--p);border:1px solid var(--ln);border-radius:1.1rem;padding:1.3rem 1.5rem 1.2rem;position:relative;overflow:hidden;display:flex;flex-direction:column;animation:up .55s both}
.kpi:nth-child(2){animation-delay:.05s}.kpi:nth-child(3){animation-delay:.1s}.kpi:nth-child(4){animation-delay:.15s}.kpi:nth-child(5){animation-delay:.2s}
.kpi:before{content:"";position:absolute;inset:0;background:radial-gradient(18rem 9rem at 100% 0,var(--g),transparent 70%);pointer-events:none}
.kt{display:flex;align-items:center;gap:.55rem;font-size:.78rem;font-weight:700;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.kt .i{color:var(--c);width:1rem;height:1rem}
.kv{font-size:3.6rem;font-weight:800;letter-spacing:-.045em;line-height:1;margin-top:.9rem}
.kv small{font-size:1.3rem;color:var(--mut);font-weight:700;letter-spacing:0;margin-left:.3rem}
.kvis{margin-top:auto;padding-top:1rem}
.kf{font-size:.82rem;color:var(--mut);margin-top:.55rem;display:flex;justify-content:space-between;gap:.5rem}
.kf b{color:var(--t2);font-weight:700}
.hbars{display:flex;align-items:flex-end;gap:3px;height:2.6rem}
.hbars i{flex:1;background:var(--c);opacity:.85;border-radius:2px 2px 0 0;min-height:2px}
.hbars i.z{opacity:.15}
.seg{display:flex;height:.55rem;border-radius:1rem;overflow:hidden;gap:2px;background:var(--p3)}
.seg i{display:block;height:100%}
.c-em{--c:var(--em);--g:rgba(52,211,153,.10)}
.c-gold{--c:var(--gold);--g:rgba(232,185,100,.10)}
.c-ro{--c:var(--ro);--g:rgba(251,113,133,.10)}
.c-sky{--c:var(--sky);--g:rgba(96,165,250,.10)}
.c-vi{--c:var(--vi);--g:rgba(167,139,250,.10)}

.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;padding:.22rem .55rem;border-radius:.4rem;white-space:nowrap}
.badge.ro{background:rgba(251,113,133,.14);color:var(--ro)}
.badge.em{background:rgba(52,211,153,.13);color:var(--em)}
.badge.mut{background:rgba(124,138,158,.12);color:var(--mut)}
.badge .i{width:.8rem;height:.8rem}

/* Overview */
.ovg{flex:1;min-height:0;display:grid;grid-template-columns:1.55fr 1fr .9fr;gap:1.1rem}
.tmap{position:relative;flex:1;min-height:0}
.tile{position:absolute;padding:3px}
.tile>div{width:100%;height:100%;border-radius:.6rem;padding:.75rem .85rem;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  background:linear-gradient(160deg,rgba(251,113,133,var(--a)),rgba(190,60,90,calc(var(--a)*.7)));border:1px solid rgba(251,113,133,.25);transition:filter .2s}
.tile .tn{font-size:.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.tile .tv{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;color:#fff}
.tile .tp{font-size:.75rem;color:rgba(255,255,255,.7);font-weight:600}
.tile.sm .tv{font-size:1rem}.tile.sm .tp{display:none}
.tile.xs .tv,.tile.xs .tp{display:none}.tile.xs .tn{font-size:.75rem}
.tile .ov{position:absolute;top:.6rem;right:.6rem;width:1.3rem;height:1.3rem;border-radius:50%;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff}
.tile .ov .i{width:.75rem;height:.75rem}

.feed{flex:1;min-height:0;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(#000 85%,transparent);mask-image:linear-gradient(#000 85%,transparent)}
.fi{display:grid;grid-template-columns:3.6rem 1rem 1fr auto;align-items:center;gap:.8rem;padding:.7rem 0;position:relative}
.fi .ft{font-size:.85rem;color:var(--mut);font-weight:700;text-align:right}
.fi .fd{width:.7rem;height:.7rem;border-radius:50%;background:var(--em);box-shadow:0 0 0 .25rem rgba(52,211,153,.12);justify-self:center;position:relative;z-index:1}
.fi:not(:last-child) .fd:after{content:"";position:absolute;left:50%;top:.7rem;width:1px;height:2.8rem;background:var(--ln2);transform:translateX(-50%)}
.fi .fn{font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .fa{font-size:1.05rem;font-weight:800;color:var(--em)}
.fsum{display:flex;align-items:baseline;gap:.5rem;padding:0 0 1rem;border-bottom:1px solid var(--ln);margin-bottom:.4rem;flex:none}
.fsum .v{font-size:2rem;font-weight:800;color:var(--em);letter-spacing:-.03em}
.fsum .l{font-size:.85rem;color:var(--mut)}

.gauge{position:relative;width:100%;max-width:17rem;margin:0 auto}
.gauge svg{width:100%;display:block}
.gauge .gc{position:absolute;left:0;right:0;bottom:0;text-align:center}
.gauge .gp{font-size:3.2rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.gauge .gl{font-size:.75rem;color:var(--mut);font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin-top:.3rem}
.kvrow{display:flex;justify-content:space-between;align-items:center;padding:.85rem 0;border-bottom:1px solid var(--ln);font-size:.92rem;color:var(--mut)}
.kvrow:last-child{border:0}
.kvrow b{font-size:1.2rem;color:var(--tx);font-weight:800}
.kvrow .sw{display:inline-block;width:.6rem;height:.6rem;border-radius:.15rem;margin-right:.5rem}

/* Stat strip for list screens */
.stats{display:grid;gap:1.1rem;flex:none}
.st{background:var(--p);border:1px solid var(--ln);border-radius:1rem;padding:1rem 1.3rem;display:flex;align-items:center;gap:1rem}
.st .si{width:2.8rem;height:2.8rem;border-radius:.75rem;display:flex;align-items:center;justify-content:center;background:var(--g);color:var(--c)}
.st .si .i{width:1.3rem;height:1.3rem}
.st .sl{font-size:.75rem;color:var(--mut);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.st .sv{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;margin-top:.15rem;line-height:1.1}
.st .sv small{font-size:.9rem;color:var(--mut);font-weight:700;margin-left:.25rem;letter-spacing:0}

/* Bar-row chart (debtors / drivers) */
.bars{flex:1;min-height:0;display:grid;gap:0 2.2rem}
.br{display:grid;grid-template-columns:2.2rem minmax(0,13rem) 1fr 8.5rem;align-items:center;gap:.9rem;border-bottom:1px solid var(--ln);min-height:0}
.br .rk{font-size:.85rem;font-weight:800;color:var(--dim);text-align:center}
.br .bn{font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:.5rem}
.br .bt{height:.7rem;background:var(--p3);border-radius:1rem;overflow:hidden}
.br .bt i{display:block;height:100%;border-radius:1rem;background:linear-gradient(90deg,rgba(251,113,133,.35),var(--ro))}
.br.over .bt i{background:linear-gradient(90deg,#f43f5e,#ff8fa3);box-shadow:0 0 .8rem rgba(251,113,133,.5)}
.br.over .rk{color:var(--ro)}
.br .ba{font-size:1.05rem;font-weight:800;text-align:right;white-space:nowrap}
.br.top3 .rk{color:var(--gold)}
.br .sd{width:.55rem;height:.55rem;border-radius:50%;flex:none}

/* Stacked chart (ombor) */
.axis{display:grid;grid-template-columns:14rem 1fr 6rem;gap:1rem;font-size:.72rem;color:var(--dim);font-weight:700;flex:none;margin-bottom:.4rem}
.axis .ticks{display:flex;justify-content:space-between}
.sk{flex:1;min-height:0;display:flex;flex-direction:column}
.skr{flex:1;min-height:0;display:grid;grid-template-columns:14rem 1fr 6rem;gap:1rem;align-items:center;border-bottom:1px solid var(--ln);max-height:4.4rem}
.skr .sn{font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skr .sn small{display:block;font-size:.75rem;color:var(--mut);font-weight:500;margin-top:.15rem}
.skt{height:1.6rem;display:flex;border-radius:.4rem;overflow:hidden;background:var(--p3);position:relative}
.skt i{display:flex;align-items:center;font-style:normal;font-size:.78rem;font-weight:800;padding:0 .55rem;white-space:nowrap;overflow:hidden}
.skt .o{background:linear-gradient(90deg,#c9963f,var(--gold));color:#2a1c04}
.skt .e{background:rgba(52,211,153,.22);color:var(--em)}
.skt:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(5,7,10,.5) calc(25% - 1px) 25%);pointer-events:none}
.skr .sp{text-align:right;font-size:1.25rem;font-weight:800}
.skr .sp.hi{color:var(--ro)}.skr .sp.md{color:var(--gold)}.skr .sp.lo{color:var(--em)}
.legend{display:flex;gap:1.2rem;font-size:.8rem;color:var(--mut);margin-left:auto}
.legend span{display:flex;align-items:center;gap:.4rem}
.legend i{width:.7rem;height:.7rem;border-radius:.2rem;display:inline-block}

/* Gantt (davomat) */
.gx{display:grid;grid-template-columns:15rem 1fr 9rem;gap:1rem;flex:none;margin-bottom:.3rem}
.gx .hrs{position:relative;height:1.1rem}
.gx .hrs span{position:absolute;transform:translateX(-50%);font-size:.72rem;color:var(--dim);font-weight:700}
.gt{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.gr{flex:1;min-height:0;max-height:4rem;display:grid;grid-template-columns:15rem 1fr 9rem;gap:1rem;align-items:center;border-bottom:1px solid var(--ln)}
.gw{display:flex;align-items:center;gap:.7rem;min-width:0}
.av{width:2.2rem;height:2.2rem;border-radius:.6rem;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;background:var(--p3);color:var(--mut);flex:none}
.av.on{background:rgba(52,211,153,.14);color:var(--em)}
.av.off{background:rgba(251,113,133,.12);color:var(--ro)}
.gw .nm{font-size:.98rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gw .rl{font-size:.75rem;color:var(--mut);margin-top:.1rem}
.gtr{position:relative;height:100%;background:repeating-linear-gradient(90deg,var(--ln) 0 1px,transparent 1px var(--hw))}
.gb{position:absolute;top:50%;height:1.1rem;transform:translateY(-50%);border-radius:.35rem;background:linear-gradient(90deg,rgba(52,211,153,.5),var(--em))}
.gb.done{background:linear-gradient(90deg,rgba(124,138,158,.35),rgba(124,138,158,.6))}
.gb.live{background:repeating-linear-gradient(-45deg,var(--em) 0 .5rem,#2bb583 .5rem 1rem);background-size:200% 100%;animation:mv 3s linear infinite}
@keyframes mv{to{background-position:-2.83rem 0}}
.gtimes{font-size:.88rem;font-weight:700;text-align:right;white-space:nowrap}
.gtimes .a{color:var(--em)}.gtimes .b{color:var(--mut)}.gtimes .n{color:var(--dim)}
.now{position:absolute;top:-1.4rem;bottom:0;width:2px;background:var(--gold);z-index:2;box-shadow:0 0 .6rem rgba(232,185,100,.6)}
.now span{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:.68rem;font-weight:800;background:var(--gold);color:#1a1205;padding:.1rem .35rem;border-radius:.25rem;white-space:nowrap}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;color:var(--mut);font-size:1rem}
.empty .i{width:2.4rem;height:2.4rem;color:var(--dim)}

/* Map */
#dmap{position:absolute;inset:0;border-radius:1.1rem;overflow:hidden;display:none;z-index:5;border:1px solid var(--ln);background:#0b1018}
.leaflet-container{background:#0b1018;font-family:inherit}
.leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.8) contrast(.92) saturate(.4)}
.mk{width:16px;height:16px;border-radius:50%;background:var(--em);border:3px solid #0b1018;box-shadow:0 0 0 2px var(--em),0 0 16px rgba(52,211,153,.8)}
.mk.off{background:var(--ro);box-shadow:0 0 0 2px var(--ro)}
.leaflet-tooltip.tip{background:rgba(13,17,23,.94);color:#f1f5f9;border:1px solid var(--ln2);border-radius:.45rem;font-weight:700;font-size:13px;padding:4px 9px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.leaflet-tooltip.tip:before{display:none}
.mapleg{position:absolute;left:1rem;top:1rem;z-index:6;display:none;gap:.7rem}
.mapleg .st{background:rgba(13,17,23,.9);backdrop-filter:blur(6px);padding:.7rem 1rem}
#dbar{position:absolute;left:1rem;right:1rem;top:1rem;z-index:6;display:none;align-items:center;gap:.8rem;padding:.65rem .7rem .65rem 1rem;background:rgba(13,17,23,.92);border:1px solid var(--ln2);border-radius:.9rem;backdrop-filter:blur(8px)}
#dbar .dn{font-size:1.2rem;font-weight:800;flex:1}
.sg{display:flex;background:#080b0f;border:1px solid var(--ln);border-radius:.65rem;padding:.25rem}
.sg button,.btn{display:flex;align-items:center;gap:.45rem;padding:.55rem .95rem;border-radius:.45rem;border:0;background:transparent;color:var(--mut);font:700 .88rem Inter,sans-serif;cursor:pointer}
.sg button .i,.btn .i{width:1rem;height:1rem}
.sg button.act{background:var(--gold);color:#1a1205}
.btn.x{background:rgba(251,113,133,.1);color:var(--ro);border:1px solid rgba(251,113,133,.25)}

/* Lock / modal */
body.locked #nav,body.locked .ctrl,body.locked .navl,body.locked .upd{visibility:hidden}
.lock{height:100%;display:flex;align-items:center;justify-content:center}
.lc{width:100%;max-width:25rem;background:var(--p);border:1px solid var(--ln);border-radius:1.4rem;padding:2.4rem 2.2rem;text-align:center;box-shadow:0 2rem 5rem rgba(0,0,0,.5);animation:up .5s both}
.lci{width:3.6rem;height:3.6rem;border-radius:1rem;margin:0 auto 1.2rem;display:flex;align-items:center;justify-content:center;background:rgba(232,185,100,.12);color:var(--gold)}
.lci .i{width:1.7rem;height:1.7rem}
.lc h2{font-size:1.45rem;font-weight:800}
.lc p{color:var(--mut);font-size:.95rem;margin-top:.45rem}
.err{color:var(--ro);font-size:.9rem;margin-top:1rem;background:rgba(251,113,133,.1);border-radius:.6rem;padding:.55rem}
.inp{display:block;width:100%;font:700 1.3rem Inter,sans-serif;padding:.9rem 1rem;border-radius:.8rem;border:1px solid var(--ln2);background:#080b0f;color:#fff;text-align:center;letter-spacing:.2em;outline:none}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 .25rem rgba(232,185,100,.13)}
.inp::placeholder{letter-spacing:.05em;color:var(--dim);font-weight:500}

<script>
let K=new URLSearchParams(location.search).get('k')||'';  // har yuklanishda bo'sh -> PIN so'raladi
const DEMO=new URLSearchParams(location.search).has('demo'); // ?demo=1 — server'siz namuna ma'lumot
const DAVOMAT_URL="https://web-production-07267.up.railway.app";  // Davomat server manzili
const $=id=>document.getElementById(id);
let DATA=null, CARS=null, DAVOMAT=null, EVENTS=null, views=[], cur=0;
let KUN=null;  // ochilgan mashinaning kunlik ma'lumoti (kesh)
let dmap=null, dlayer=null;
const HAR_SONIYA=14;

const I={
  home:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',

  wallet:'<path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><circle cx="16" cy="14" r="1.2"/>',
  box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/>',
  truck:'<path d="M2 6h11v10H2zM13 10h4l4 4v2h-8"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  prev:'<path d="M15 18l-6-6 6-6"/>', next:'<path d="M9 18l6-6-6-6"/>',
  pause:'<path d="M9 5v14M15 5v14"/>', play:'<path d="M7 4.5l12 7.5-12 7.5z"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  route:'<circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/>',
  live:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  inn:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>',
  road:'<path d="M4 20L8 4M20 20L16 4M12 6v2M12 11v2M12 16v2"/>'
};
function ic(n){ return '<span class="i"><svg viewBox="0 0 24 24">'+(I[n]||'')+'</svg></span>'; }
document.querySelectorAll('[data-i]').forEach(el=>{ el.innerHTML='<svg viewBox="0 0 24 24">'+(I[el.dataset.i]||'')+'</svg>'; });

function son(n){ n=Math.round(n||0); return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g," "); }
function qisqa(n){ n=n||0; if(n>=1e9)return (n/1e9).toFixed(1)+" mlrd"; if(n>=1e6)return (n/1e6).toFixed(1)+" mln"; return son(n); }
function qH(n){ n=n||0; if(n>=1e9)return (n/1e9).toFixed(1)+'<small>mlrd</small>'; if(n>=1e6)return (n/1e6).toFixed(1)+'<small>mln</small>'; return son(n); }
function esc(s){ return (s==null?'':(''+s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function bosh(s){ const p=(''+(s||'')).trim().split(/\s+/); return esc(((p[0]||'')[0]||'')+((p[1]||'')[0]||'')).toUpperCase()||'?'; }
function toshkent(){ const d=new Date(); return new Date(d.getTime()+(d.getTimezoneOffset()+300)*60000); }
function daq(s){ const m=/(\d{1,2}):(\d{2})/.exec(s||''); return m?(+m[1]*60+ +m[2]):null; }
function hhmm(t){ t=(''+(t||'')); const m=t.match(/T(\d{2}:\d{2})/)||t.match(/(\d{2}:\d{2})/); return m?m[1]:''; }
function soatdaq(m){ m=Math.round(m||0); const h=Math.floor(m/60), d=m%60; return (h?(h+' soat '):'')+d+' daq'; }
const p2=n=>String(n).padStart(2,'0');
const OYLAR=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentyabr","oktyabr","noyabr","dekabr"];
const KUNLAR=["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"];
function soat(){ const t=toshkent();
  $('clock').textContent=p2(t.getHours())+":"+p2(t.getMinutes()); $('sec').textContent=":"+p2(t.getSeconds());
  $('date').textContent=t.getDate()+"-"+OYLAR[t.getMonth()]+", "+t.getFullYear(); $('wday').textContent=KUNLAR[t.getDay()]; }
const bo=(icon,m)=>'<div class="empty">'+ic(icon)+'<div>'+m+'</div></div>';
function stats(arr){ return '<div class="stats" style="grid-template-columns:repeat('+arr.length+',1fr)">'+arr.map(s=>
  '<div class="st c-'+s[0]+'"><div class="si">'+ic(s[1])+'</div><div><div class="sl">'+s[2]+'</div><div class="sv">'+s[3]+'</div></div></div>').join('')+'</div>'; }
function sahifa(arr,per){ const r=[]; for(let i=0;i<arr.length;i+=per) r.push({bet:arr.slice(i,i+per),bosh:i,s:Math.floor(i/per)+1,j:Math.ceil(arr.length/per)}); return r; }

/* Squarified treemap */
function squarify(items,x,y,w,h){
  const out=[]; let rest=items.slice();
  while(rest.length){
    const sh=Math.min(w,h); const worst=r=>{const s=r.reduce((a,b)=>a+b.v,0),mx=Math.max(...r.map(z=>z.v)),mn=Math.min(...r.map(z=>z.v));return Math.max(sh*sh*mx/(s*s),(s*s)/(sh*sh*mn));};
    let row=[rest[0]], i=1;
    while(i<rest.length && worst(row.concat(rest[i]))<=worst(row)){ row.push(rest[i]); i++; }
    const s=row.reduce((a,b)=>a+b.v,0);
    if(w>=h){ const cw=s/h; let cy=y; row.forEach(r=>{ const rh=r.v/cw; out.push(Object.assign({},r,{x,y:cy,w:cw,h:rh})); cy+=rh; }); x+=cw; w-=cw; }
    else { const rh=s/w; let cx=x; row.forEach(r=>{ const rw=r.v/rh; out.push(Object.assign({},r,{x:cx,y,w:rw,h:rh})); cx+=rw; }); y+=rh; h-=rh; }
    rest=rest.slice(i);
  }
  return out;
}

/* ===== Ekranlar ===== */
function ekranUmumiy(d){
  const q=(d.top_qarzdor||[]).filter(x=>(x.qarz||0)>0), t=(d.oxirgi_tolov||[]);
  const ij=d.jihoz_ijarada||0, jm=d.jihoz_jami||0, pct=jm>0?Math.min(100,ij/jm*100):0;
  const tsum=t.reduce((s,x)=>s+(x.summa||0),0);
  // soatbay tushum (08–20)
  const hrs=new Array(13).fill(0); t.forEach(x=>{ const m=daq(x.vaqt); if(m!=null){ const h=Math.floor(m/60)-8; if(h>=0&&h<13) hrs[h]+=x.summa||0; } });
  const hmax=Math.max(1,...hrs);
  const kun=toshkent().getDate(), ort=(d.oylik_tushum||0)/Math.max(1,kun);
  const ijq=d.jami_qarz||0, stq=d.sotuv_qarz||0, qj=Math.max(1,ijq+stq);
  const qs=d.qarzdor_soni||0, os=d.over_soni||0;
  const k=[
    `<div class="kpi c-em"><div class="kt">${ic('trend')}Bugungi tushum</div><div class="kv">${qH(d.bugun_tushum)}</div>
      <div class="kvis"><div class="hbars">${hrs.map(v=>'<i class="'+(v?'':'z')+'" style="height:'+Math.max(6,v/hmax*100)+'%"></i>').join('')}</div>
      <div class="kf"><span>08:00</span><span><b>${t.length}</b> ta to'lov</span><span>20:00</span></div></div></div>`,
    `<div class="kpi c-gold"><div class="kt">${ic('cal')}Bu oy tushum</div><div class="kv">${qH(d.oylik_tushum)}</div>
      <div class="kvis"><div class="seg"><i style="width:${kun/30*100}%;background:var(--gold)"></i></div>
      <div class="kf"><span>Kunlik o'rtacha</span><b>${qisqa(ort)} so'm</b></div></div></div>`,
    `<div class="kpi c-ro"><div class="kt">${ic('debt')}Jami qarz</div><div class="kv" style="color:var(--ro)">${qH(ijq+stq)}</div>
      <div class="kvis"><div class="seg"><i style="width:${ijq/qj*100}%;background:var(--ro)"></i>${stq?'<i style="width:'+stq/qj*100+'%;background:var(--gold)"></i>':''}</div>
      <div class="kf"><span>Ijara <b>${qisqa(ijq)}</b></span>${stq?'<span>Sotuv <b style="color:var(--gold)">'+qisqa(stq)+'</b></span>':'<span>so\'m</span>'}</div></div></div>`,
    `<div class="kpi c-vi"><div class="kt">${ic('users')}Qarzdorlar</div><div class="kv">${son(qs)}<small>ta</small></div>
      <div class="kvis"><div class="seg"><i style="width:${qs?os/qs*100:0}%;background:var(--ro)"></i><i style="flex:1;background:rgba(167,139,250,.5)"></i></div>
      <div class="kf">${os?'<span style="color:var(--ro)"><b style="color:var(--ro)">'+os+'</b> ta chegaradan oshgan</span>':'<span style="color:var(--em)">Hammasi chegarada</span>'}</div></div></div>`
  ];
  if((d.predoplata_jami||0)>0) k.push(`<div class="kpi c-sky"><div class="kt">${ic('wallet')}Predoplata</div><div class="kv" style="color:var(--sky)">${qH(d.predoplata_jami)}</div>
      <div class="kvis"><div class="kf" style="margin:0"><span>Biz qarzmiz</span><span><b>${d.predoplata_soni||0}</b> mijoz</span></div></div></div>`);

  // treemap
  let tm='';
  if(q.length){
    const W=160,H=100, tot=q.reduce((s,x)=>s+x.qarz,0);
    const tiles=squarify(q.map((x,i)=>({x0:x,i,v:x.qarz/tot*W*H})),0,0,W,H);
    tm=tiles.map(r=>{ const wp=r.w/W*100, hp=r.h/H*100, cls=(wp<11||hp<16)?'xs':((wp<20||hp<26)?'sm':'');
      const a=Math.max(.18,.62-r.i*.06);
      return `<div class="tile ${cls}" style="left:${r.x/W*100}%;top:${r.y/H*100}%;width:${wp}%;height:${hp}%"><div style="--a:${a}">
        <div class="tn">${esc(r.x0.ism)}</div><div><div class="tv">${son(r.x0.qarz)}</div><div class="tp">${(r.x0.qarz/Math.max(1,ijq)*100).toFixed(1)}% umumiy qarzdan</div></div>
        ${r.x0.over?'<span class="ov">'+ic('alert')+'</span>':''}</div></div>`; }).join('');
  }
  const C=Math.PI*80, off=C*(1-pct/100);
  return {nom:"Umumiy holat", ic:'home', html:
    `<div class="kpis" style="grid-template-columns:repeat(${k.length},1fr)">${k.join('')}</div>
    <div class="ovg">
      <div class="card c-ro"><div class="ch"><span class="dotc"></span><h3>Eng katta qarzdorlar</h3><span class="hint">blok o'lchami = qarz miqdori · ${ic('alert').replace('class="i"','class="i" style="width:.8rem;height:.8rem;vertical-align:-2px"')} oshgan</span></div>
        <div class="tmap">${tm||bo('check',"Qarzdor yo'q")}</div></div>
      <div class="card c-em"><div class="ch"><span class="dotc"></span><h3>Bugungi to'lovlar</h3><span class="hint">jonli lenta</span></div>
        ${t.length?`<div class="fsum"><span class="v">+${son(tsum)}</span><span class="l">so'm · ${t.length} ta to'lov</span></div>
        <div class="feed">${t.map(x=>`<div class="fi"><span class="ft">${esc(x.vaqt||'')}</span><span class="fd"></span><span class="fn">${esc(x.ism)}</span><span class="fa">+${son(x.summa)}</span></div>`).join('')}</div>`
        :bo('clock',"Bugun hali to'lov yo'q")}</div>
      <div class="card c-gold"><div class="ch"><span class="dotc"></span><h3>Jihozlar bandligi</h3></div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.2rem;min-height:0">
        <div class="gauge"><svg viewBox="0 0 200 112"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset=".6" stop-color="#e8b964"/><stop offset="1" stop-color="#fb7185"/></linearGradient></defs>
          <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="#171f2a" stroke-width="14" stroke-linecap="round"/>
          <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="url(#gg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
          <div class="gc"><div class="gp">${Math.round(pct)}%</div><div class="gl">ijarada</div></div></div>
        <div><div class="kvrow"><span><i class="sw" style="background:var(--gold)"></i>Ijarada</span><b>${son(ij)}</b></div>
          <div class="kvrow"><span><i class="sw" style="background:var(--em)"></i>Omborda</span><b>${son(Math.max(0,jm-ij))}</b></div>
          <div class="kvrow"><span><i class="sw" style="background:var(--dim)"></i>Jami</span><b>${son(jm)}</b></div></div></div></div>
    </div>`};
}
function ekranlarQarzdor(d){
  const all=d.barcha_qarzdor||[]; if(!all.length) return [];
  const mx=Math.max(1,...all.map(x=>x.qarz||0)), over=all.filter(x=>x.over).length;
  return sahifa(all,30).map(p=>{ const rows=Math.min(15,Math.ceil(p.bet.length/2));
    return {nom:"Hamma qarzdorlar", pg:p.j>1?(p.s+'/'+p.j):'', ic:'debt', html:
    stats([['vi','users','Qarzdorlar',son(all.length)+'<small>ta</small>'],['ro','debt','Umumiy qarz',qH(d.jami_qarz)],['ro','alert','Chegaradan oshgan',son(over)+'<small>ta</small>'],['gold','trend','O\'rtacha qarz',qH((d.jami_qarz||0)/Math.max(1,all.length))]])
    +`<div class="card" style="flex:1"><div class="ch"><h3>Qarz miqdori bo'yicha reyting</h3><span class="legend"><span><i style="background:var(--ro)"></i>Qarz</span><span><i style="background:#f43f5e;box-shadow:0 0 .4rem #fb7185"></i>Chegaradan oshgan</span></span></div>
      <div class="bars" style="grid-template-columns:1fr 1fr;grid-template-rows:repeat(${rows},minmax(0,3.6rem));grid-auto-flow:column;align-content:start">
      ${p.bet.map((x,j)=>{ const n=p.bosh+j+1; return `<div class="br ${x.over?'over':''} ${n<=3?'top3':''}"><span class="rk">${n}</span><span class="bn">${esc(x.ism)}${x.over?'<span class="badge ro">oshgan</span>':''}</span><span class="bt"><i style="width:${Math.max(1.5,(x.qarz||0)/mx*100)}%"></i></span><span class="ba">${son(x.qarz)}</span></div>`; }).join('')}
      </div></div>`}; });

function ekranlarDavomat(d){
  const ppl=(d.odamlar||[]);
  const st=stats([['em','inn','Keldi',son(d.keldi||0)+'<small>kishi</small>'],['ro','out','Ketdi',son(d.ketdi||0)+'<small>kishi</small>'],['gold','users','Ichkarida',son(d.ichkarida||0)+'<small>kishi</small>'],['sky','clock','Kelmagan',son(ppl.filter(o=>!o.kirish).length)+'<small>kishi</small>']]);
  if(!ppl.length) return [{nom:"Davomat", ic:'clock', kind:"text", html:st+'<div class="card" style="flex:1">'+bo('clock','Bugun hali hech kim qayd etilmadi')+'</div>'}];
  const t=toshkent(), now=t.getHours()*60+t.getMinutes();
  const ins=ppl.map(o=>daq(o.kirish)).filter(x=>x!=null), outs=ppl.map(o=>daq(o.chiqish)).filter(x=>x!=null);
  const A=Math.min(7*60,Math.floor(Math.min(...ins.concat([8*60]))/60)*60), B=Math.max(19*60,Math.ceil(Math.max(...outs.concat([now]))/60)*60);
  const span=B-A, pos=m=>Math.max(0,Math.min(100,(m-A)/span*100)), hw=(60/span*100)+'%';
  const hrs=[]; for(let h=A;h<=B;h+=60) hrs.push('<span style="left:'+pos(h)+'%">'+p2(h/60)+':00</span>');
  const sorted=ppl.slice().sort((a,b)=>(daq(a.kirish)??9999)-(daq(b.kirish)??9999));
  return sahifa(sorted,14).map(p=>({nom:"Davomat", pg:p.j>1?(p.s+'/'+p.j):'', ic:'clock', kind:"text", html:
    st+`<div class="card" style="flex:1"><div class="ch"><h3>Bugungi ish vaqti</h3><span class="legend"><span><i style="background:var(--em)"></i>Ichkarida</span><span><i style="background:rgba(124,138,158,.6)"></i>Ketgan</span><span><i style="background:var(--gold)"></i>Hozir</span></span></div>
      <div class="gx"><span></span><div class="hrs">${hrs.join('')}</div><span></span></div>
      <div class="gt">${p.bet.map(o=>{ const a=daq(o.kirish), b=daq(o.chiqish), ich=a!=null&&b==null;
        const bar=a!=null?`<div class="gb ${ich?'live':'done'}" style="left:${pos(a)}%;width:${Math.max(.6,pos(b!=null?b:now)-pos(a))}%"></div>`:'';
        return `<div class="gr"><div class="gw"><div class="av ${ich?'on':''}">${bosh(o.ism)}</div><div style="min-width:0"><div class="nm">${esc(o.ism)}</div>${o.ish?'<div class="rl">'+esc(o.ish)+'</div>':''}</div></div>
          <div class="gtr" style="--hw:${hw}">${bar}</div>
          <div class="gtimes">${a!=null?'<span class="a">'+esc(o.kirish)+'</span>':'<span class="n">kelmagan</span>'}${a!=null?' <span class="b">→ '+(b!=null?esc(o.chiqish):'hozir')+'</span>':''}</div></div>`; }).join('')}
        <div style="position:absolute;left:calc(15rem + 1rem);right:calc(9rem + 1rem);top:0;bottom:0;pointer-events:none"><div class="now" style="left:${pos(now)}%"><span>${p2(t.getHours())}:${p2(t.getMinutes())}</span></div></div>
      </div></div>`}));
}
function ekranlarMashina(cars){

/* ===== Xarita ===== */
function initDmap(){
  if(dmap||typeof L==='undefined') return;
  dmap=L.map('dmap',{zoomControl:false,attributionControl:false}).setView([41.311,69.24],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(dmap);
  dlayer=L.layerGroup().addTo(dmap);
}
function yangilaMarkerlar(){
  if(!dmap||!CARS) return;
  dlayer.clearLayers(); const pts=[];
  CARS.forEach(c=>{
    if(c.lat==null||c.lon==null) return;
    const icn=L.divIcon({className:'',html:'<div class="mk '+(c.harakat?'':'off')+'"></div>',iconSize:[16,16],iconAnchor:[8,8]});
    const m=L.marker([c.lat,c.lon],{icon:icn}).addTo(dlayer);
    m.bindTooltip(esc(c.nom)+(c.harakat?(' · '+(c.tezlik||0)+' km/s'):(c.km?(' · '+son(c.km)+' km'):'')),{permanent:true,direction:'top',offset:[0,-10],className:'tip'});
    m.on('click',()=>ochMashina(c.id!=null?c.id:-1));
    pts.push([c.lat,c.lon]);
  });
  if(pts.length){ try{ dmap.fitBounds(pts,{padding:[80,80],maxZoom:14}); }catch(e){} }
  const on=CARS.filter(c=>c.harakat).length;
  $('mapleg').innerHTML='<div class="st c-em"><div class="si">'+ic('truck')+'</div><div><div class="sl">Harakatda</div><div class="sv">'+on+'</div></div></div><div class="st c-ro"><div class="si">'+ic('alert')+'</div><div><div class="sl">To\'xtagan</div><div class="sv">'+(CARS.length-on)+'</div></div></div>';
}

/* ===== Aylanish ===== */
function qurViews(){
  views=[]; if(DATA){ views.push(ekranUmumiy(DATA)); ekranlarOmbor(DATA).forEach(v=>views.push(v)); views.push(ekranBandlik(DATA)); ekranlarQarzdor(DATA).forEach(v=>views.push(v)); ekranlarSotuv(DATA).forEach(v=>views.push(v)); }
  if(DAVOMAT) ekranlarDavomat(DAVOMAT).forEach(v=>views.push(v));
  if(CARS && CARS.length){
    ekranlarMashina(CARS).forEach(v=>views.push(v));
    views.push({nom:"Jonli xarita", ic:'map', kind:"dmap", html:""});
  }
  const prog=$('prog')||Object.assign(document.createElement('i'),{id:'prog'});
  $('nav').innerHTML=views.map((v,i)=>'<div class="nv'+(i===cur?' on':'')+'" onclick="borga('+i+')">'+ic(v.ic)+'<span class="nt">'+v.nom+'</span>'+(v.pg?'<span class="np">'+v.pg+'</span>':'')+'<span class="trk"></span></div>').join('');
  const a=$('nav').querySelector('.nv.on .trk'); if(a) a.appendChild(prog); else document.body.appendChild(prog);
}
function koarsat(i){
  if(!views.length) return;
  cur=((i%views.length)+views.length)%views.length;
  const v=views[cur];
  $('scr_nom').textContent=v.nom+(v.pg?(' · '+v.pg):'');
  $('scr_idx').textContent='Ekran '+(cur+1)+' / '+views.length;
  if(v.kind==="dmap"){
    $('stage').innerHTML="";
    $('dmap').style.display="block"; $('mapleg').style.display="flex";
    initDmap();
    setTimeout(()=>{ if(dmap){ dmap.invalidateSize(); yangilaMarkerlar(); } },60);
  }else{
    $('dmap').style.display="none"; $('mapleg').style.display="none";
    $('stage').innerHTML='<div class="scr">'+v.html+'</div>';
  }
  [...$('nav').children].forEach((el,idx)=>{ el.classList.toggle('on',idx===cur); if(idx===cur){ const t=el.querySelector('.trk'); const p=$('prog'); if(t&&p) t.appendChild(p); } });
  progReset();
}
function keyingi(){ if(views.length && !DETAIL) koarsat(cur+1); }

let PAUSED=false, rotTimer=null, DETAIL=false, detailId=null, detailMode='kunlik';
function progReset(){
  const p=$('prog'); if(!p) return; p.style.transition='none'; p.style.width='0%'; void p.offsetWidth;
  if(PAUSED||DETAIL) return;
  p.style.transition='width '+HAR_SONIYA+'s linear'; p.style.width='100%';
}
function startRot(){ stopRot(); rotTimer=setInterval(()=>{ if(!PAUSED && !DETAIL) keyingi(); }, HAR_SONIYA*1000); progReset(); }
function stopRot(){ if(rotTimer) clearInterval(rotTimer); rotTimer=null; }
function qol(d){ if(DETAIL) return; koarsat(cur+d); startRot(); }
function borga(i){ if(DETAIL) return; koarsat(i); startRot(); }
function pauza(){
  PAUSED=!PAUSED;
  const b=$('pbtn'); b.innerHTML=ic(PAUSED?'play':'pause'); b.classList.toggle('pp',!PAUSED);
  const p=$('prog'); if(PAUSED&&p){ p.style.width=getComputedStyle(p).width; p.style.transition='none'; }
  if(!PAUSED) startRot();
}
document.addEventListener('keydown',e=>{
  if(e.target && e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){ qol(1); }
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ qol(-1); }
  else if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(DETAIL) orqaga(); else pauza(); }
  else if(e.key==='Escape'||e.key==='Backspace'){ if(DETAIL) orqaga(); }
});

async function ochMashina(id){
  if(id<0 || !CARS) return;
  const c=CARS.find(x=>x.id===id); if(!c) return;
  DETAIL=true; detailId=id; detailMode='kunlik'; KUN=null;
  progReset();
  $('scr_nom').textContent=c.nom; $('scr_idx').textContent='Mashina marshruti';
  $('stage').innerHTML=""; $('dmap').style.display="block"; $('mapleg').style.display="none";
  $('dbar_nom').textContent=c.nom; $('dbar_av').innerHTML=bosh(c.nom); $('dbar_av').className='av '+(c.harakat?'on':'off');
  $('dbar').style.display="flex";
  initDmap(); setTimeout(()=>{ if(dmap) dmap.invalidateSize(); },60);
  setMode('kunlik');
}
function setMode(m){
  detailMode=m;
  $('btn_kunlik').classList.toggle('act',m==='kunlik');
  $('btn_jonli').classList.toggle('act',m==='jonli');
  chizMarshrut();
}
function _carId(id){ return (CARS&&CARS.find(c=>c.id===id))||null; }
async function chizMarshrut(){
  if(!dmap||detailId==null) return;
  try{
    const c=_carId(detailId);
    if(detailMode==='jonli'){
      dlayer.clearLayers();
      if(c && c.lat!=null){
        const icn=L.divIcon({className:'',html:'<div class="mk '+(c.harakat?'':'off')+'"></div>',iconSize:[16,16],iconAnchor:[8,8]});
        L.marker([c.lat,c.lon],{icon:icn}).bindTooltip(esc(c.nom)+(c.harakat?(' · '+(c.tezlik||0)+' km/s'):''),{permanent:true,direction:'top',offset:[0,-10],className:'tip'}).addTo(dlayer);
        dmap.setView([c.lat,c.lon],15);
      }
      $('dbar_nom').textContent=(c?c.nom:'');
      return;
    }
    // kunlik marshrut
    let x=KUN;
    if(!x){
      if(DEMO) x=demoKun(detailId);
      else { const r=await fetch('/api/tv_gps_kun?id='+detailId+(K?('&k='+encodeURIComponent(K)):'')); x=await r.json(); }
      KUN=x;
    }
    dlayer.clearLayers();
    const pts=(x.nuqtalar||[]).map(p=>[p.lat,p.lon]);
    if(pts.length>1){
      L.polyline(pts,{color:'#000',weight:10,opacity:.5}).addTo(dlayer);
      L.polyline(pts,{color:'#e8b964',weight:4.5,opacity:1}).addTo(dlayer);
      L.circleMarker(pts[0],{radius:8,color:'#0b1018',weight:3,fillColor:'#34d399',fillOpacity:1}).bindTooltip('Boshlanish',{direction:'top',offset:[0,-6],className:'tip'}).addTo(dlayer);
      L.circleMarker(pts[pts.length-1],{radius:8,color:'#0b1018',weight:3,fillColor:'#fb7185',fillOpacity:1}).bindTooltip('Oxirgi nuqta',{direction:'top',offset:[0,-6],className:'tip'}).addTo(dlayer);
    }
    (x.toxtashlar||[]).forEach(s=>{
      L.circleMarker([s.lat,s.lon],{radius:6,color:'#0b1018',weight:2,fillColor:'#fb7185',fillOpacity:1})
        .bindTooltip(hhmm(s.boshlanish)+'–'+hhmm(s.tugash)+' ('+s.daqiqa+' daq)'+(s.joy?(' · '+esc(s.joy)):''),{direction:'top',offset:[0,-6],className:'tip'}).addTo(dlayer);
    });
    (x.hodisalar||[]).forEach(h=>{
      L.marker([h.lat,h.lon],{icon:L.divIcon({className:'',html:'<div style="background:#fb7185;color:#0b1018;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid #0b1018;font-size:12px">!</div>',iconSize:[22,22],iconAnchor:[11,11]})})
        .bindTooltip(Math.round(h.tezlik)+' km/s · '+hhmm(h.vaqt),{permanent:true,direction:'top',offset:[0,-10],className:'tip'}).addTo(dlayer);
    });
    if(pts.length){ try{ dmap.fitBounds(pts,{padding:[100,70],maxZoom:15}); }catch(e){} }
    else if(c&&c.lat!=null){ dmap.setView([c.lat,c.lon],14); }
    if(x.km!=null){
      $('dbar_nom').innerHTML=esc(c?c.nom:'')+' <span style="color:var(--mut);font-weight:600;font-size:.9rem">· '+x.km+' km · '+soatdaq(x.harakat_min)+' · max '+(x.max_tezlik||0)+' km/s</span>';
    }
  }catch(e){}
}
function orqaga(){
  DETAIL=false; detailId=null; KUN=null; $('dbar').style.display="none"; $('dmap').style.display="none";
  const i=views.findIndex(v=>v.nom==="Mashinalar");
  koarsat(i>=0?i:0); startRot();
}

async function pinTekshir(){
  try{ const r=await fetch('/api/dashboard'+(K?('?k='+encodeURIComponent(K)):'')); if(r.status===403) return false; const d=await r.json(); return !d.xato; }

function pinEkran(xato){
  document.body.classList.add('locked');
  $('scr_nom').textContent="Kirish"; $('scr_idx').textContent="Himoyalangan ekran";
  $('stage').innerHTML='<div class="lock"><div class="lc"><div class="lci">'+ic('lock')+'</div><h2>TEMIRCHI</h2><p>Boshqaruv markaziga kirish uchun parolni kiriting</p>'
    +(xato?'<div class="err">Parol xato, qayta urinib ko\'ring</div>':'')
    +'<div style="margin-top:1.4rem"><input id="pinp" class="inp" type="password" inputmode="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Parol" /></div>'
    +'<button class="bp" onclick="pinKirit()">Kirish</button></div></div>';
  setTimeout(function(){var p=$('pinp'); if(p){p.focus(); p.onkeydown=function(e){if(e.key==='Enter')pinKirit();};}},50);
}
window.pinKirit=async function(){
  const p=$('pinp'); if(!p) return;
  K=(p.value||'').trim();
  if(!K){ pinEkran(true); return; }
  if(await pinTekshir()) ishga(); else { K=''; pinEkran(true); }
};
async function ishga(){
  document.body.classList.remove('locked');
  $('stage').innerHTML='';
  hammasi(); setInterval(hammasi,30000);

}
window.pinOzgartir=function(){
  if(DEMO){ alert("Demo rejimda PIN o'zgartirib bo'lmaydi"); return; }
  var bg=document.createElement('div'); bg.className='modal';
  bg.innerHTML='<div class="lc"><div class="lci">'+ic('gear')+'</div><h2 style="font-size:1.25rem">PIN o\'zgartirish</h2><p>Yangi PIN kamida 4 belgidan iborat bo\'lsin</p>'
    +'<input id="opin" class="inp" type="password" placeholder="Eski PIN" style="margin-top:1.2rem" />'
    +'<input id="npin1" class="inp" type="password" placeholder="Yangi PIN" />'
    +'<input id="npin2" class="inp" type="password" placeholder="Yangi PIN — yana bir marta" />'
    +'<div id="npmsg" class="msg"></div><div class="r2"><button id="npno" class="bs">Bekor</button><button id="npok" class="bp">Saqlash</button></div></div>';
  document.body.appendChild(bg);
  setTimeout(()=>{ const o=$('opin'); if(o) o.focus(); },50);
  bg.querySelector('#npno').onclick=function(){bg.remove();};
  bg.onclick=function(e){ if(e.target===bg) bg.remove(); };
  bg.querySelector('#npok').onclick=async function(){
    var esk=($('opin').value||'').trim(), a=($('npin1').value||'').trim(), b=($('npin2').value||'').trim(), msg=$('npmsg');
    if(!esk){ msg.textContent='Eski PINni kiriting'; return; }
    if(a.length<4){ msg.textContent='Yangi PIN kamida 4 belgi'; return; }
    if(a!==b){ msg.textContent='Yangi PINlar mos kelmadi'; return; }
    try{
      var r=await fetch('/api/tv_pin_ozgartir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({k:esk,yangi:a})});
      var j=await r.json();
      if(j&&j.ok){ K=a; bg.remove(); } else { msg.textContent=(j&&j.xato)||'Eski PIN xato'; }
    }catch(e){ msg.textContent='Xato'; }
  };
};
