<!doctype html><html lang="uz"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEMIRCHI — Boshqaruv ekrani</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0e131b;--bg2:#151c27;--card:#141b26;--card2:#182130;--line:#243040;--gold:#c2a878;--gr:#5aa588;--rd:#c47a7a;--tx:#e6ebf2;--mut:#8593a6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0e131b;color:var(--tx);height:100vh;overflow:hidden;padding:2.6vh 2.4vw}
.head{display:flex;align-items:center;gap:16px;margin-bottom:1.8vh;padding-bottom:1.6vh;border-bottom:1px solid var(--line)}
.logo{width:58px;height:58px;border-radius:12px;object-fit:cover;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.brand{font-size:26px;font-weight:800;letter-spacing:.14em;color:#fff}
.sub{color:var(--mut);font-size:13px;margin-top:4px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.clock{margin-left:auto;text-align:right}
.clock .t{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock .d{color:var(--mut);font-size:14px;margin-top:4px;letter-spacing:.04em}
.dots{display:flex;gap:7px;margin:0 18px}
.dots i{width:7px;height:7px;border-radius:50%;background:#2c3849;transition:.4s}
.dots i.on{background:var(--gold);width:22px;border-radius:4px}
.stage{position:relative;height:calc(100vh - 15vh)}
.screen{position:absolute;inset:0;opacity:0;transform:translateY(6px);transition:opacity .7s ease,transform .7s ease}
.screen.show{opacity:1;transform:none}
.stitle{font-size:19px;font-weight:700;margin-bottom:1.8vh;display:flex;align-items:center;gap:10px;letter-spacing:.02em;color:#eef2f7}
.stitle .cnt{margin-left:auto;font-size:14px;color:var(--mut);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5vw;margin-bottom:2.2vh}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2.3vh 1.7vw;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);opacity:.6}
.kpi.green:before{background:var(--gr)}.kpi.red:before{background:var(--rd)}
.kpi .l{color:var(--mut);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font-size:3vw;font-weight:800;margin-top:12px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .u{font-size:1vw;color:var(--mut);font-weight:500}
.kpi.green .v{color:var(--gr)}.kpi.gold .v{color:var(--gold)}.kpi.red .v{color:var(--rd)}
.kpi .ic{display:none}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:1.5vw;height:calc(100vh - 32vh)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2vh 1.5vw;display:flex;flex-direction:column;min-height:0}
.rows{display:flex;flex-direction:column;gap:.9vh;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:1.15vh 15px;background:var(--bg2);border-radius:10px;border:1px solid var(--line)}
.row .rk{color:var(--mut);font-weight:700;width:26px;font-size:15px}
.row .nm{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.row .amt.red{color:var(--rd)}.row .amt.green{color:var(--gr)}
.tag{font-size:11px;font-weight:600;padding:2px 9px;border-radius:5px;background:#2a2226;color:var(--rd)}
.row .tm{font-size:13px;color:var(--mut);width:48px;text-align:right}
.bar{height:10px;background:var(--bg2);border-radius:6px;overflow:hidden;margin-top:auto;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--gold)}
.omb{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-top:10px;letter-spacing:.02em}
.cols{column-count:3;column-gap:1.3vw;height:100%}
.qc{break-inside:avoid;display:flex;align-items:center;gap:10px;padding:.95vh 13px;background:var(--bg2);border-radius:9px;border:1px solid var(--line);margin-bottom:.75vh}
.qc .rk{color:var(--gold);font-weight:700;width:26px;font-size:14px}
.qc .nm{flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qc .amt{font-size:15px;font-weight:700;color:var(--rd);font-variant-numeric:tabular-nums}
.qc.over{border-color:#3d2c30}
.empty{color:var(--mut);text-align:center;padding:3vh;font-size:15px}
.foot{position:fixed;bottom:1.2vh;left:2.4vw;color:#3a475a;font-size:12px;letter-spacing:.03em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gr);display:inline-block;margin-right:7px;animation:p 3s infinite}
@keyframes p{50%{opacity:.4}}
#dmap{position:fixed;left:2.4vw;right:2.4vw;top:14.5vh;bottom:4vh;border-radius:14px;overflow:hidden;display:none;z-index:5;border:1px solid var(--line);background:#0e1622}
.hd{display:flex;align-items:center;gap:11px;padding:1vh 13px;background:var(--bg2);border-radius:10px;border:1px solid var(--line);margin-bottom:.75vh}
.hd .st{width:10px;height:10px;border-radius:50%;flex:none}
.hd .st.on{background:var(--gr);box-shadow:0 0 7px var(--gr)} .hd .st.off{background:var(--rd)}
.hd .nm{flex:1;font-size:16px;font-weight:600}
.hd .km{font-size:16px;font-weight:800;color:var(--gold)}
.hd .tg{font-size:12px;color:var(--mut);width:120px;text-align:right}
.mk{background:var(--gr);width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5)}
.mk.off{background:var(--rd)}
.leaflet-tooltip.tip{background:#1c2534;color:#dbe3ee;border:1px solid #39465e;border-radius:8px;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.leaflet-tooltip.tip:before{display:none}
.ctrl{position:fixed;bottom:1vh;right:2vw;z-index:20;display:flex;gap:8px}
.ctrl button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:#1c2534cc;color:#dbe3ee;font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}
.ctrl button:hover{background:#26324a}
#dbar{position:fixed;left:2.2vw;right:2.2vw;top:14.5vh;z-index:6;display:none;align-items:center;gap:10px;padding:10px 14px;background:#1c2534ee;border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
#dbar .dn{font-size:19px;font-weight:800;flex:1}
#dbar button{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#26324a;color:#dbe3ee;font-size:14px;font-weight:700;cursor:pointer}
#dbar button.act{background:var(--gold);color:#1a1200;border-color:var(--gold)}
#dbar button.x{background:#3a2529;color:#e0a0a0}
@media (max-width:640px){
  .head{flex-wrap:wrap;gap:8px;margin-bottom:12px;padding-bottom:10px}
  .brand{font-size:22px}
  .sub{font-size:12px}
  .clock{font-size:20px}
  .clock .d{font-size:12px}
  .dots{margin:6px 0;order:3;width:100%}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  .kpi{padding:14px 12px;border-radius:14px}
  .stage{height:auto;min-height:calc(100vh - 120px)}
  .screen{position:relative}
  .cols{column-count:1 !important;height:auto}
  .stitle{font-size:17px;flex-wrap:wrap}
  .stitle .cnt{font-size:12px}
  .ctrl{bottom:12px;right:12px}
  .ctrl button{width:52px;height:52px;font-size:22px}
  .qc{break-inside:avoid}
}
</style></head>
<body>
<div class="head">
  <img class="logo" src="/logo.png" alt="TEMIRCHI">
  <div><div class="brand">TEMIRCHI</div><div class="sub" id="scr_nom">Umumiy holat</div></div>
  <div class="dots" id="dots"></div>
  <div class="clock"><div class="t" id="clock">--:--</div><div class="d" id="date">—</div></div>
</div>
<div class="stage" id="stage"></div>
<div id="dmap"></div>
<div id="dbar">
  <div class="dn" id="dbar_nom">—</div>
  <button id="btn_kunlik" onclick="setMode('kunlik')">🗺 Kunlik yo'l</button>
  <button id="btn_jonli" onclick="setMode('jonli')">📍 Jonli</button>
  <button class="x" onclick="orqaga()">✕ Orqaga</button>
</div>
<div class="ctrl">
  <button onclick="qol(-1)" title="Oldingi">◀</button>
  <button id="pbtn" onclick="pauza()" title="To'xtatish/davom">⏸</button>
  <button onclick="qol(1)" title="Keyingi">▶</button>
</div>
<div class="foot"><span class="dot"></span>Jonli — avtomat aylanadi</div>
<script>
let K=new URLSearchParams(location.search).get('k')||'';  // har yuklanishda bo'sh -> PIN so'raladi
const GPS_URL="https://web-production-a8c5f.up.railway.app";  // GPS server manzili
const DAVOMAT_URL="https://web-production-07267.up.railway.app";  // Davomat server manzili
const $=id=>document.getElementById(id);
let DATA=null, DRIVERS=null, DAVOMAT=null, views=[], cur=0;
let dmap=null, dlayer=null;
const HAR_SONIYA=14;
function son(n){ n=Math.round(n||0); return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g," "); }
function qisqa(n){ n=n||0; if(n>=1e9)return (n/1e9).toFixed(1)+" mlrd"; if(n>=1e6)return (n/1e6).toFixed(1)+" mln"; return son(n); }
function esc(s){ return (s==null?'':(''+s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function soat(){ const d=new Date(); const t=new Date(d.getTime()+(d.getTimezoneOffset()+300)*60000);
  const p=n=>String(n).padStart(2,'0'); $('clock').textContent=p(t.getHours())+":"+p(t.getMinutes());
  const oy=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentyabr","oktyabr","noyabr","dekabr"];
  $('date').textContent=t.getDate()+"-"+oy[t.getMonth()]+", "+t.getFullYear(); }
function ekranUmumiy(d){
  const q=(d.top_qarzdor||[]), t=(d.oxirgi_tolov||[]);
  const ij=d.jihoz_ijarada||0, jm=d.jihoz_jami||0, pct=jm>0?Math.min(100,ij/jm*100):0;
  return {nom:"Umumiy holat", html:
   '<div class="kpis">'
   +'<div class="kpi green"><div class="ic">💵</div><div class="l">Bugungi tushum</div><div class="v">'+qisqa(d.bugun_tushum)+'</div><div class="u">so\'m</div></div>'
   +'<div class="kpi gold"><div class="ic">📅</div><div class="l">Bu oy tushum</div><div class="v">'+qisqa(d.oylik_tushum)+'</div><div class="u">so\'m</div></div>'
   +'<div class="kpi red"><div class="ic">📕</div><div class="l">Jami qarz (ijara)</div><div class="v">'+qisqa(d.jami_qarz)+'</div><div class="u">so\'m'+((d.sotuv_qarz||0)>0?(' · sotuv: '+qisqa(d.sotuv_qarz)):'')+'</div></div>'
   +'<div class="kpi"><div class="ic">👥</div><div class="l">Qarzdorlar</div><div class="v">'+(d.qarzdor_soni||0)+'</div><div class="u">'+(d.over_soni||0)+' ta chegaradan oshgan</div></div>'
   +'</div><div class="grid2">'
   +'<div class="panel"><div class="stitle" style="font-size:19px">📕 Eng katta qarzdorlar</div><div class="rows">'
   +(q.length? q.map((x,i)=>'<div class="row"><span class="rk">'+(i+1)+'</span><div class="nm">'+esc(x.ism)+'</div>'+(x.over?'<span class="tag">oshgan</span>':'')+'<div class="amt red">'+son(x.qarz)+'</div></div>').join('') : '<div class="empty">Qarzdor yo\'q 👍</div>')
   +'</div></div>'
   +'<div class="panel"><div class="stitle" style="font-size:19px">💵 Bugungi to\'lovlar</div><div class="rows" style="flex:1">'
   +(t.length? t.map(x=>'<div class="row"><div class="nm">'+esc(x.ism)+'</div><div class="amt green">+'+son(x.summa)+'</div><div class="tm">'+esc(x.vaqt)+'</div></div>').join('') : '<div class="empty">Bugun to\'lov yo\'q</div>')
   +'</div><div class="stitle" style="font-size:17px;margin-top:1.4vh">📦 Jihozlar (ijarada)</div>'
   +'<div class="bar"><i style="width:'+pct+'%"></i></div>'
   +'<div class="omb"><span>Ijarada: '+son(ij)+'</span><span>Jami: '+son(jm)+'</span></div></div></div>'};
}
function ekranlarQarzdor(d){
  const all=d.barcha_qarzdor||[]; const res=[]; const PER=30;
  if(!all.length) return [];
  for(let i=0;i<all.length;i+=PER){
    const bet=all.slice(i,i+PER), bosh=i, sahifa=Math.floor(i/PER)+1, jami=Math.ceil(all.length/PER);
    res.push({nom:"Hamma qarzdorlar"+(jami>1?(' ('+sahifa+'/'+jami+')'):""), html:
      '<div class="stitle">📕 Hamma qarzdorlar <span class="cnt">jami '+all.length+' ta · umumiy '+son(d.jami_qarz)+' so\'m</span></div>'
      +'<div class="cols">'+bet.map((x,j)=>'<div class="qc '+(x.over?'over':'')+'"><span class="rk">'+(bosh+j+1)+'</span><div class="nm">'+esc(x.ism)+'</div><div class="amt">'+son(x.qarz)+'</div></div>').join('')+'</div>'});
  }
  return res;
}
function ekranHaydRoyxat(drs){
  const on=drs.filter(d=>d.online).length;
  return {nom:"Haydovchilar — ro'yxat", kind:"text", html:
    '<div class="stitle">🚚 Haydovchilar <span class="cnt">'+on+' faol · '+(drs.length-on)+' aloqa yo\'q</span></div>'
    +'<div class="cols" style="column-count:2">'
    +drs.map(d=>{
      const st=d.online?'on':'off';
      const holat=d.online?'🟢 yo\'lda':(d.last_daq!=null?('🔴 '+d.last_daq+' daq'):'—');
      return '<div class="hd" style="cursor:pointer" onclick="ochHaydovchi('+(d.id||-1)+')"><span class="st '+st+'"></span><div class="nm">'+esc(d.ism)+'</div>'
        +'<div class="km">'+son(d.km||0)+' km</div><div class="tg">'+holat+(d.vaqt?(' · '+esc(d.vaqt)):'')+'</div></div>';
    }).join('')+'</div>'};
}
function initDmap(){
  if(dmap||typeof L==='undefined') return;
  dmap=L.map('dmap',{zoomControl:false,attributionControl:false}).setView([41.311,69.24],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(dmap);
  dlayer=L.layerGroup().addTo(dmap);
}
function yangilaMarkerlar(){
  if(!dmap||!DRIVERS) return;
  dlayer.clearLayers(); const pts=[];
  DRIVERS.forEach(d=>{
    if(d.lat==null||d.lon==null) return;
    const ic=L.divIcon({className:'',html:'<div class="mk '+(d.online?'':'off')+'"></div>',iconSize:[16,16],iconAnchor:[8,8]});
    const m=L.marker([d.lat,d.lon],{icon:ic}).addTo(dlayer);
    m.bindTooltip(esc(d.ism)+(d.online?' 🟢':' 🔴'),{permanent:true,direction:'top',offset:[0,-8],className:'tip'});
    pts.push([d.lat,d.lon]);
  });
  if(pts.length){ try{ dmap.fitBounds(pts,{padding:[60,60],maxZoom:14}); }catch(e){} }
}

function ekranDavomat(d){
  const ppl=(d.odamlar||[]);
  return {nom:"Davomat — keldi/ketdi", kind:"text", html:
    '<div class="stitle">🕐 Davomat <span class="cnt">'+(d.keldi||0)+' keldi · '+(d.ketdi||0)+' ketdi · '+(d.ichkarida||0)+' ichkarida</span></div>'
    +(ppl.length?('<div class="cols" style="column-count:2">'
      +ppl.map(o=>{
        const kir=o.kirish||'—', chiq=o.chiqish||'—';
        const ish=o.ish?('<span class="tg">'+esc(o.ish)+'</span>'):'';
        return '<div class="hd"><span class="st '+(o.chiqish?'off':'on')+'"></span><div class="nm">'+esc(o.ism)+'</div>'
          +'<div class="km" style="color:var(--gr)">🟢 '+kir+'</div><div class="km" style="color:var(--rd);margin-left:8px">🔴 '+chiq+'</div>'+ish+'</div>';
      }).join('')+'</div>')
      :'<div class="empty">Bugun hali hech kim qayd etilmadi</div>')};
}
function ekranlarOmbor(d){
  const all=(d.ombor||[]).filter(x=>(x.total||0)>0 || (x.out||0)>0);
  if(!all.length) return [];
  const res=[]; const PER=16;
  for(let i=0;i<all.length;i+=PER){
    const bet=all.slice(i,i+PER), sahifa=Math.floor(i/PER)+1, jami=Math.ceil(all.length/PER);
    res.push({nom:"Ombor — ostatka"+(jami>1?(' ('+sahifa+'/'+jami+')'):""), kind:"text", html:
      '<div class="stitle">📦 Ombor — ostatka <span class="cnt">'+all.length+' mahsulot · '+son(d.jihoz_ijarada)+' arendada / '+son(d.jihoz_jami)+' jami</span></div>'
      +'<div class="cols" style="column-count:2">'
      +bet.map(x=>
        '<div class="qc" style="display:block;padding:14px 16px">'
        +'<div class="nm" style="font-size:20px;margin-bottom:10px">'+esc(x.name)+'</div>'
        +'<div style="display:flex;gap:18px;font-size:16px;flex-wrap:wrap">'
          +'<span style="color:#8ea0b6">Jami: <b style="color:#fff">'+son(x.total)+'</b></span>'
          +'<span style="color:var(--gold)">Arendada: <b>'+son(x.out)+'</b></span>'
          +'<span style="color:var(--gr)">Omborda: <b>'+son(x.omborda)+'</b></span>'
        +'</div></div>').join('')
      +'</div>'});
  }
  return res;
}
function qurViews(){
  views=[]; if(DATA){ views.push(ekranUmumiy(DATA)); ekranlarOmbor(DATA).forEach(v=>views.push(v)); ekranlarQarzdor(DATA).forEach(v=>views.push(v)); }
  if(DAVOMAT) views.push(ekranDavomat(DAVOMAT));
  if(DRIVERS && DRIVERS.length){
    views.push(ekranHaydRoyxat(DRIVERS));
    views.push({nom:"Haydovchilar — jonli xarita", kind:"dmap", html:""});
  }
  $('dots').innerHTML=views.map((_,i)=>'<i class="'+(i===cur?'on':'')+'"></i>').join('');
}
function koarsat(i){
  cur=((i%views.length)+views.length)%views.length;
  const v=views[cur];
  $('scr_nom').textContent=v.nom;
  if(v.kind==="dmap"){
    $('stage').innerHTML="";
    $('dmap').style.display="block";
    initDmap();
    setTimeout(()=>{ if(dmap){ dmap.invalidateSize(); yangilaMarkerlar(); } },60);
  }else{
    $('dmap').style.display="none";
    $('stage').innerHTML='<div class="screen show">'+v.html+'</div>';
  }
  [...$('dots').children].forEach((el,idx)=>el.classList.toggle('on',idx===cur));
}
function keyingi(){ if(views.length && !DETAIL) koarsat(cur+1); }

let PAUSED=false, rotTimer=null, DETAIL=false, detailId=null, detailMode='kunlik';
function startRot(){ stopRot(); rotTimer=setInterval(()=>{ if(!PAUSED && !DETAIL) keyingi(); }, HAR_SONIYA*1000); }
function stopRot(){ if(rotTimer) clearInterval(rotTimer); rotTimer=null; }
function qol(d){ if(DETAIL) return; koarsat(cur+d); startRot(); }
function pauza(){ PAUSED=!PAUSED; $('pbtn').textContent=PAUSED?'▶':'⏸'; if(!PAUSED) startRot(); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){ qol(1); }
  else if(e.key==='ArrowLeft'){ qol(-1); }
  else if(e.key===' '){ e.preventDefault(); if(DETAIL) orqaga(); else pauza(); }
  else if(e.key==='Escape'){ if(DETAIL) orqaga(); }
});

async function ochHaydovchi(id){
  if(id<0 || !DRIVERS) return;
  const d=DRIVERS.find(x=>x.id===id); if(!d) return;
  DETAIL=true; detailId=id; detailMode='kunlik';
  $('scr_nom').textContent="Haydovchi: "+d.ism;
  $('stage').innerHTML=""; $('dmap').style.display="block";
  $('dbar_nom').textContent=d.ism; $('dbar').style.display="flex";
  initDmap(); setTimeout(()=>{ if(dmap) dmap.invalidateSize(); },60);
  setMode('kunlik');
}
function setMode(m){
  detailMode=m;
  $('btn_kunlik').classList.toggle('act',m==='kunlik');
  $('btn_jonli').classList.toggle('act',m==='jonli');
  chizMarshrut();
}
async function chizMarshrut(){
  if(!dmap||detailId==null) return;
  try{
    const r=await fetch(GPS_URL+'/api/tv_marshrut?id='+detailId+(K?('&k='+encodeURIComponent(K)):''));
    const x=await r.json();
    dlayer.clearLayers();
    if(detailMode==='jonli'){
      const h=x.hozir;
      if(h && h.lat!=null){
        const ic=L.divIcon({className:'',html:'<div class="mk"></div>',iconSize:[16,16],iconAnchor:[8,8]});
        L.marker([h.lat,h.lon],{icon:ic}).bindTooltip('🟢 Hozir'+(h.vaqt?(' '+h.vaqt):''),{permanent:true,direction:'top',offset:[0,-8],className:'tip'}).addTo(dlayer);
        dmap.setView([h.lat,h.lon],15);
      }
      return;
    }
    const pts=(x.nuqtalar||[]).map(p=>[p.lat,p.lon]);
    if(pts.length){
      L.polyline(pts,{color:'#06233d',weight:8,opacity:.6}).addTo(dlayer);
      L.polyline(pts,{color:'#ffffff',weight:4,opacity:.95}).addTo(dlayer);
      L.circleMarker(pts[0],{radius:7,color:'#fff',fillColor:'#2ecc71',fillOpacity:1}).addTo(dlayer);
      L.circleMarker(pts[pts.length-1],{radius:7,color:'#fff',fillColor:'#e74c3c',fillOpacity:1}).addTo(dlayer);
      (x.toxtashlar||[]).forEach(s=>{
        L.circleMarker([s.lat,s.lon],{radius:5,color:'#fff',fillColor:'#c0392b',fillOpacity:1})
          .bindTooltip(s.daqiqa+' daq',{permanent:true,direction:'top',offset:[0,-6],className:'tip'}).addTo(dlayer);
      });
      try{ dmap.fitBounds(pts,{padding:[50,50]}); }catch(e){}
    }
  }catch(e){}
}

// ---- PIN himoyasi ----
async function pinTekshir(){
  try{
    const r=await fetch('/api/dashboard'+(K?('?k='+encodeURIComponent(K)):''));
    if(r.status===403) return false;
    const d=await r.json();
    return !d.xato;
  }catch(e){ return false; } // xato bo'lsa ham kiritmaymiz (xavfsiz)
}
function pinEkran(xato){
  var st=document.getElementById('stage');
  if(!st) return;
  st.innerHTML=
    '<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:16px;text-align:center">'
    +'<div style="font-size:44px">🔒</div>'
    +'<div style="font-size:20px;font-weight:800;color:var(--gold)">TEMIRCHI — Dashboard</div>'
    +'<div style="color:#8ea0b6;font-size:15px">Kirish uchun parolni kiriting</div>'
    +(xato?'<div style="color:var(--rd);font-size:15px">❌ Parol xato, qayta urining</div>':'')
    +'<input id="pinp" type="password" inputmode="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Parol"'
    +' style="font-size:22px;padding:14px 18px;border-radius:12px;border:2px solid #2a3648;background:#141c28;color:#fff;text-align:center;width:100%;max-width:280px;box-sizing:border-box" />'
    +'<button onclick="pinKirit()" style="font-size:18px;font-weight:700;padding:13px 40px;border-radius:12px;border:none;background:var(--gold);color:#1a1a1a;cursor:pointer;width:100%;max-width:280px">Kirish</button>'
    +'</div>';
  setTimeout(function(){var p=document.getElementById('pinp'); if(p){p.focus(); p.onkeydown=function(e){if(e.key==='Enter')pinKirit();};}},50);
}
window.pinKirit=async function(){
  const p=document.getElementById('pinp'); if(!p) return;
  K=(p.value||'').trim();
  if(!K){ pinEkran(true); return; }
  if(await pinTekshir()){
    ishga();          // eslab qolmaydi — har yuklanishda qayta so'raladi
  }else{
    K='';
    pinEkran(true);
  }
};
async function ishga(){
  hammasi(); setInterval(hammasi,30000);
  startRot();
  // Sozlama (PIN o'zgartirish) tugmasi — burchakda
  if(!document.getElementById('tvgear')){
    var g=document.createElement('button');
    g.id='tvgear'; g.textContent='🔧';
    g.title='PIN o\'zgartirish';
    g.style.cssText='position:fixed;top:10px;right:10px;z-index:9998;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.10);color:#fff;font-size:20px;cursor:pointer';
    g.onclick=pinOzgartir;
    document.body.appendChild(g);
  }
}
window.pinOzgartir=function(){
  var bg=document.createElement('div');
  bg.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10000;display:flex;align-items:center;justify-content:center;padding:18px';
  bg.innerHTML='<div style="background:#141c28;border-radius:16px;padding:22px;width:100%;max-width:320px;text-align:center">'
    +'<div style="font-size:19px;font-weight:800;color:var(--gold);margin-bottom:14px">🔧 PIN o\'zgartirish</div>'
    +'<input id="opin" type="password" inputmode="text" placeholder="Eski PIN" style="font-size:18px;padding:12px;border-radius:10px;border:2px solid #2a3648;background:#0e1824;color:#fff;text-align:center;width:100%;box-sizing:border-box;margin-bottom:10px" />'
    +'<input id="npin1" type="password" inputmode="text" placeholder="Yangi PIN (kamida 4 belgi)" style="font-size:18px;padding:12px;border-radius:10px;border:2px solid #2a3648;background:#0e1824;color:#fff;text-align:center;width:100%;box-sizing:border-box;margin-bottom:10px" />'
    +'<input id="npin2" type="password" inputmode="text" placeholder="Yangi PIN — yana bir marta" style="font-size:18px;padding:12px;border-radius:10px;border:2px solid #2a3648;background:#0e1824;color:#fff;text-align:center;width:100%;box-sizing:border-box;margin-bottom:14px" />'
    +'<div id="npmsg" style="color:var(--rd);font-size:14px;min-height:18px;margin-bottom:8px"></div>'
    +'<div style="display:flex;gap:8px"><button id="npno" style="flex:1;padding:12px;border-radius:10px;border:1px solid #2a3648;background:transparent;color:#cdd" >Bekor</button>'
    +'<button id="npok" style="flex:2;padding:12px;border-radius:10px;border:none;background:var(--gold);color:#1a1a1a;font-weight:700">Saqlash</button></div></div>';
  document.body.appendChild(bg);
  bg.querySelector('#npno').onclick=function(){bg.remove();};
  bg.onclick=function(e){ if(e.target===bg) bg.remove(); };
  bg.querySelector('#npok').onclick=async function(){
    var esk=(document.getElementById('opin').value||'').trim();
    var a=(document.getElementById('npin1').value||'').trim();
    var b=(document.getElementById('npin2').value||'').trim();
    var msg=document.getElementById('npmsg');
    if(!esk){ msg.textContent='Eski PINni kiriting'; return; }
    if(a.length<4){ msg.textContent='Yangi PIN kamida 4 belgi'; return; }
    if(a!==b){ msg.textContent='Yangi PINlar mos kelmadi'; return; }
    try{
      var r=await fetch('/api/tv_pin_ozgartir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({k:esk,yangi:a})});
      var j=await r.json();
      if(j&&j.ok){ K=a; bg.remove(); }
      else { msg.textContent=(j&&j.xato)||'Eski PIN xato'; }
    }catch(e){ msg.textContent='Xato'; }
  };
};
// Har safar (har yuklanishda) PIN so'raladi. URL da ?k= bo'lsa va to'g'ri bo'lsa — o'sha bilan kiradi.
(async function(){
  if(K && await pinTekshir()) ishga();
  else { K=''; pinEkran(false); }
})();
